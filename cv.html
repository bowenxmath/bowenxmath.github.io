<!-- =========================================================
     PDF.js
========================================================= -->

<script type="module">

    import * as pdfjsLib
        from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


    const pdfURL =
        "assets/files/Bowen_Xie_CV.pdf";


    const container =
        document.getElementById("cv-pages");


    const loading =
        document.getElementById("cv-loading");


    async function renderCV() {

        try {

            const pdf =
                await pdfjsLib
                    .getDocument(pdfURL)
                    .promise;


            loading.style.display =
                "none";


            for (
                let pageNumber = 1;
                pageNumber <= pdf.numPages;
                pageNumber++
            ) {

                const page =
                    await pdf.getPage(pageNumber);


                const pageWrapper =
                    document.createElement("div");


                pageWrapper.className =
                    "cv-page";


                const canvas =
                    document.createElement("canvas");


                canvas.className =
                    "cv-page-canvas";


                pageWrapper.appendChild(canvas);

                container.appendChild(pageWrapper);


                const baseViewport =
                    page.getViewport({
                        scale: 1
                    });


                /*
                 * Render based on the available width.
                 * Maximum desktop width is approximately
                 * standard letter-page viewing size.
                 */

                const availableWidth =
                    Math.min(
                        container.clientWidth - 32,
                        800
                    );


                const scale =
                    availableWidth /
                    baseViewport.width;


                const viewport =
                    page.getViewport({
                        scale: scale
                    });


                const pixelRatio =
                    window.devicePixelRatio || 1;


                canvas.width =
                    Math.floor(
                        viewport.width *
                        pixelRatio
                    );


                canvas.height =
                    Math.floor(
                        viewport.height *
                        pixelRatio
                    );


                canvas.style.width =
                    viewport.width + "px";


                canvas.style.height =
                    viewport.height + "px";


                const context =
                    canvas.getContext("2d");


                await page.render({

                    canvasContext: context,

                    viewport: viewport,

                    transform: [
                        pixelRatio,
                        0,
                        0,
                        pixelRatio,
                        0,
                        0
                    ]

                }).promise;

            }

        } catch (error) {

            console.error(
                "Unable to load CV:",
                error
            );


            loading.innerHTML =
                'Unable to display the CV. ' +
                '<a href="' +
                pdfURL +
                '" target="_blank">' +
                'Open the PDF directly' +
                '</a>.';

        }

    }


    renderCV();

</script>
